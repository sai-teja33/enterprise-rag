<section class="documents-page">
  <div class="page-header">
    <div>
      <h1>Department Documents</h1>
      <p>Manage and inspect the selected department's knowledge base.</p>
    </div>

    <div class="page-actions" aria-label="Document actions">
      <button
        type="button"
        mat-stroked-button
        class="page-action page-action--secondary"
        (click)="loadStatus()"
      >
        <mat-icon>refresh</mat-icon>
        <span>Refresh</span>
      </button>

      <button
        type="button"
        mat-flat-button
        color="primary"
        class="page-action page-action--primary"
        (click)="openUploadDialog()"
      >
        <mat-icon>upload_file</mat-icon>
        <span>Upload Document</span>
      </button>
    </div>
  </div>

  @if (isLoading) {
    <app-loading-state message="Loading department documents..."></app-loading-state>
  } @else if (!statusResponse || !documents.length) {
    <app-empty-state
      title="No documents found"
      description="Upload PDF or DOCX files to build the selected department knowledge base."
    ></app-empty-state>
  } @else {
    <mat-card class="panel-card">
      <div class="ag-theme-quartz" style="height: 100%; width: 100%">
        <ag-grid-angular
          class="documents-grid"
          [rowData]="documents"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [gridOptions]="gridOptions"
          [animateRows]="true"
          [theme]="theme"
        ></ag-grid-angular>
      </div>
    </mat-card>
  }
</section>
